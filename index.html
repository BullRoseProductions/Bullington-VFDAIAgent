<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>B4C — Before the Call</title>

    <!-- Don't let the platform inflate text on its own. Same stopgap as the Android text-zoom lock
         in MainActivity, from the other side: this covers iOS and older WebViews, where the engine
         scales text up without being asked and fixed-pixel layouts collide. Harmless everywhere it
         is not needed. Both are temporary — the durable fix is font-scale-flexible layouts. -->
    <style>html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }</style>

    <!-- PHONES SCROLLING SIDE-TO-SIDE (Ashlea, 2026-10-31). iOS — Safari and the app's WKWebView alike — ZOOMS IN when a
         text field under 16px is tapped, and stays zoomed: every screen with a form then pans sideways. Every input here
         was 12–15px (FS.input 14.5, the sign-in box 15). On touch screens, form text is 16px — the size iOS doesn't zoom
         at — so the page never zooms in the first place. !important because the app sets input sizes inline. Pinch-zoom
         stays available (no maximum-scale / user-scalable=no: that would take zoom away from people who need it).
         overflow-wrap: break-word is the typographic default, not a clip: a long email / URL / serial breaks only when
         it would otherwise run past its line — ordinary text is untouched, and nothing overflowing is hidden. -->
    <style>
      html { overflow-wrap: break-word; }
      @media (hover: none) and (pointer: coarse) {
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
        select, textarea { font-size: 16px !important; }
      }
    </style>

    <!-- Favicons (assets live in public/, served from web root) -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32.png" />
    <link rel="apple-touch-icon" href="/favicon_180.png" />

    <!-- PWA: installable home-screen app (standalone/full-screen). Frontend-only,
         no service worker yet — offline support can be a later add. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0C0F" /><!-- FIRE.sidebar: the noir top bar, so the browser chrome runs into it -->
    <!-- iOS home-screen (Safari ignores the manifest's display/theme; needs its own tags) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B4C" />

    <!-- Open Graph / Twitter social share preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="B4C — Before the Call" />
    <meta property="og:description" content="Keeping responders prepared" />
    <meta property="og:image" content="/b4c-og-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="B4C — Before the Call" />
    <meta name="twitter:description" content="Keeping responders prepared" />
    <meta name="twitter:image" content="/b4c-og-share.png" />
    <style>
      /* Zero the browser's default body margin (8px) so the app's dark
         background reaches all four viewport edges. Without this, the gap
         shows the default white canvas as a frame — invisible under the old
         light login, glaring under the navy one. Dark base bg is a
         belt-and-suspenders so no light ever peeks at the edges (login + app). */
      html, body { margin: 0; }
      body { background: #080A10; }

      /* Native form controls: force a dark scheme so browsers never pick a
         white system popup (fixes white-on-white <option> lists / date
         pickers on machines whose OS default is light — the app is dark-themed).
         color-scheme is the root cure; the explicit control/option colors are
         belt-and-suspenders for Chrome/Firefox on Windows/Linux. */
      :root { color-scheme: dark; }
      select,
      option,
      input[type="date"],
      input[type="month"],
      input[type="time"] {
        background-color: #13161B;   /* FIRE.card */
        color: #F7F8FA;              /* FIRE.textPrimary */
      }
      option { background-color: #13161B; color: #F7F8FA; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
